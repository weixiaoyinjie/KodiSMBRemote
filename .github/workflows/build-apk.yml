name: Build Kodi Cinema Remote v2.2 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Select v2.2 source ZIP first, then fallback to extracted source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*v2.2*.zip' | sort | tail -n 1)"
          if [ -n "$ARCHIVE" ]; then
            echo "Using new v2.2 ZIP: $ARCHIVE"
            mkdir -p "$RUNNER_TEMP/kodi-v22"
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/kodi-v22"
            ROOT="$(find "$RUNNER_TEMP/kodi-v22" -maxdepth 7 -type f -name settings.gradle -print -quit)"
          else
            ROOT="$(find "$GITHUB_WORKSPACE" -maxdepth 7 -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "${ROOT:-}" ]; then
            echo 'ERROR: No v2.2 ZIP or extracted Android project found.'
            exit 1
          fi
          PROJECT_DIR="$(dirname "$ROOT")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Compiling Android project: $PROJECT_DIR"
          grep -E 'versionName|versionCode' "$PROJECT_DIR/app/build.gradle" || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/apk-output/KodiCinemaRemote-v2.2-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KodiCinemaRemote-v2.2-debug
          path: apk-output/KodiCinemaRemote-v2.2-debug.apk
          if-no-files-found: error
