name: Build Kodi Cinema Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Android SDK at: $ANDROID_HOME"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Android project (ZIP or extracted files)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -name settings.gradle -print -quit)"
          if [ -z "$ROOT" ]; then
            ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*Kodi*Cinema*.zip' -print -quit)"
            if [ -z "$ARCHIVE" ]; then ARCHIVE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print -quit)"; fi
            if [ -z "$ARCHIVE" ]; then echo 'No project or ZIP found'; exit 1; fi
            mkdir -p "$RUNNER_TEMP/kodi-cinema"
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/kodi-cinema"
            ROOT="$(find "$RUNNER_TEMP/kodi-cinema" -maxdepth 7 -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "$ROOT" ]; then echo 'settings.gradle missing'; exit 1; fi
          PROJECT_DIR="$(dirname "$ROOT")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Build Android debug APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/apk-output/KodiCinemaRemote-v2.0-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KodiCinemaRemote-v2.0-debug
          path: apk-output/KodiCinemaRemote-v2.0-debug.apk
          if-no-files-found: error
