name: Build Kodi SMB Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Find or unzip Android project
        shell: bash
        run: |
          set -euo pipefail
          project_file="$(find "$GITHUB_WORKSPACE" -maxdepth 7 -type f -name settings.gradle -print -quit)"
          if [ -z "$project_file" ]; then
            zip_file="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print -quit)"
            if [ -z "$zip_file" ]; then
              echo 'ERROR: No settings.gradle or source ZIP found.'
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -80
              exit 1
            fi
            echo "Found source archive: $zip_file"
            mkdir -p "$RUNNER_TEMP/kodi-smb-source"
            unzip -q "$zip_file" -d "$RUNNER_TEMP/kodi-smb-source"
            project_file="$(find "$RUNNER_TEMP/kodi-smb-source" -maxdepth 8 -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "$project_file" ]; then
            echo 'ERROR: Source is incomplete: settings.gradle not found.'
            exit 1
          fi
          project_dir="$(dirname "$project_file")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Android project directory: $project_dir"
          ls -la "$project_dir"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KodiSMBRemote-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
