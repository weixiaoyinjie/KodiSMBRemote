name: Build Kodi SMB Remote APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: KodiSMBRemote-v1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
